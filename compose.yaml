x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    logging: *default-logging
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # 公网连接由 DOCKER-USER 防火墙和腾讯云安全组共同限制来源 IP。
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  qdrant:
    logging: *default-logging
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 180m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    ports:
      # 本地准生产默认只监听回环地址，避免意外暴露到局域网。
      - "127.0.0.1:8000:8000"
    volumes:
      - upload_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      mcp-tools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-tools:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["python", "-m", "app.mcp_server"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8010), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  knowledge-worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["python", "-m", "app.knowledge_worker"]
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  document-publisher:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["python", "-m", "app.document_publisher"]
    mem_limit: 128m
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  document-worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    command: ["python", "-m", "app.document_worker"]
    mem_limit: 350m
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
  qdrant_data:
  upload_data:
  rabbitmq_data:
